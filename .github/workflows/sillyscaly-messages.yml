name: SillyScaly Android - messages display fix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sillyscaly-android-native
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
    steps:
      - name: Check out pinned Element X source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: element-hq/element-x-android
          ref: 4b62a99d925e5ecb051f635874bc47edc43b59e7
          persist-credentials: false
          submodules: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6

      - name: Apply separate application identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('plugins/src/main/kotlin/config/BuildTimeConfig.kt')
          source = path.read_text()
          replacements = {
              'const val APPLICATION_ID = "io.element.android.x"': 'const val APPLICATION_ID = "net.sillyscaly.chat"',
              'const val APPLICATION_NAME = "Element X"': 'const val APPLICATION_NAME = "SillyScaly Chat"',
              'val METADATA_HOST_REVERSED: String? = null': 'val METADATA_HOST_REVERSED: String? = "net.sillyscaly.chat"',
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit('Unexpected upstream source: ' + old)
              source = source.replace(old, new, 1)
          path.write_text(source)
          Path('SILLYSCALY-STATUS.txt').write_text(
              'Custom reactions, sticker catalog and a message editor with custom emoji. Native sticker catalog requires the server extension.\n'
              'Upstream: element-hq/element-x-android\n'
              'Commit: 4b62a99d925e5ecb051f635874bc47edc43b59e7\n'
              'Debug application ID: net.sillyscaly.chat.debug\n'
              'Signed with the upstream public DEBUG key; testing only.\n'
          )
          PY

      - name: Apply native custom reactions
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          files = json.loads(zlib.decompress(base64.b64decode('')))
          for name, item in files.items():
              path = Path(name)
              if path.is_absolute() or '..' in path.parts:
                  raise SystemExit('Unsafe source path')
              if item['sha256'] is None:
                  if path.exists(): raise SystemExit('Unexpected existing file: ' + name)
              elif hashlib.sha256(path.read_bytes()).hexdigest() != item['sha256']:
                  raise SystemExit('Upstream changed: ' + name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(item['content'])
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          needle = 'getByName("release") {'
          assert s.count(needle) == 1
          s = s.replace(needle, needle + '\n            applicationIdSuffix = ".debug"', 1)
          s = s.replace('"$oAuthRedirectSchemeBase",', '"$oAuthRedirectSchemeBase.debug",', 1)
          import os
          s = s.replace('versionCode = Versions.VERSION_CODE', 'versionCode = Versions.VERSION_CODE + ' + str(200 + int(os.environ['GITHUB_RUN_NUMBER'])), 1)
          s = s.replace('versionName = Versions.VERSION_NAME', 'versionName = Versions.VERSION_NAME + "-sillyscaly-messages.' + os.environ['GITHUB_RUN_NUMBER'] + '"', 1)
          p.write_text(s)
          PY

      - name: Test emoji message encoding
        run: |
          set -o pipefail
          ./gradlew :features:messages:impl:testDebugUnitTest --tests 'io.element.android.features.messages.impl.customemoji.EmojiMessageTest' --tests 'io.element.android.features.messages.impl.customemoji.StickerDisplayInfoTest' --no-daemon --max-workers=2 --stacktrace --no-configuration-cache 2>&1 | tee build-sillyscaly.log

      - name: Test Matrix emoji HTML handling
        run: |
          set -o pipefail
          ./gradlew :libraries:matrixui:testDebugUnitTest --tests 'io.element.android.libraries.matrix.ui.messages.ToHtmlDocumentTest' --tests 'io.element.android.libraries.matrix.ui.messages.ToPlainTextTest' --no-daemon --max-workers=2 --stacktrace --no-configuration-cache 2>&1 | tee -a build-sillyscaly.log

      - name: Build optimized F-Droid APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleFDroidRelease --no-daemon --max-workers=2 --stacktrace --no-configuration-cache 2>&1 | tee -a build-sillyscaly.log

      - name: Save build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SillyScaly-build-log
          path: build-sillyscaly.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify and name the APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re, shutil, subprocess
          files = list(Path('app/build/outputs/apk/fdroid/release').glob('*arm64-v8a*.apk'))
          assert len(files) == 1, 'Expected exactly one ARM64 APK'
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools' / '37.0.0'
          manifest = subprocess.check_output([str(tools/'aapt2'), 'dump', 'badging', str(files[0])], text=True)
          assert "name='net.sillyscaly.chat.debug'" in manifest
          assert int(re.search(r"versionCode='(\d+)'", manifest)[1]) > 202610014
          subprocess.run([str(tools/'apksigner'), 'verify', str(files[0])], check=True)
          target = Path('delivery'); target.mkdir()
          shutil.copy2(files[0], target / 'SillyScaly-Chat-messages-arm64.apk')
          (target/'build-info.txt').write_text('Workflow: messages\nRun: '+os.environ['GITHUB_RUN_NUMBER']+'\n'+manifest.splitlines()[0]+'\n')
          PY

      - name: Save APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SillyScaly-Chat-messages-arm64-${{ github.run_number }}
          path: |
            delivery/SillyScaly-Chat-messages-arm64.apk
            delivery/build-info.txt
            SILLYSCALY-STATUS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Package corresponding source
        run: |
          git add -N features/messages/impl libraries/matrix libraries/htmlrenderer libraries/matrixui
          git ls-files -z | tar --null -T - --ignore-failed-read -czf "$RUNNER_TEMP/SillyScaly-native-source.tar.gz"

      - name: Save corresponding source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SillyScaly-Chat-messages-source
          path: ${{ runner.temp }}/SillyScaly-native-source.tar.gz
          retention-days: 14
